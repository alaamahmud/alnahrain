<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مقر النهرين الحي</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2933; --muted: #6b7280; --line: #e5e1d8;
    --floor: #faf8f3; --room-desk: #eef6f4; --room-meeting: #f3eefb; --room-kitchen: #fdf3e7;
    --room-lounge: #eaf1f8; --room-ceo: #fbeceb; --accent: #2a9d8f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c; --panel: #1c2027; --ink: #e8eaed; --muted: #9aa3ad; --line: #2c323b;
      --floor: #181c22; --room-desk: #17302c; --room-meeting: #2a2238; --room-kitchen: #33291b;
      --room-lounge: #1b2836; --room-ceo: #3a2321;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Tahoma, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
  .live { color: #e63946; font-weight: 700; }
  .live::before { content: "●"; margin-left: 4px; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  #clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; margin-inline-start: auto; }

  main { display: grid; grid-template-columns: 1fr 340px; gap: 12px; padding: 12px; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }

  /* المخطط */
  #office { position: relative; aspect-ratio: 16 / 10; background: var(--floor); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .room { position: absolute; border-radius: 10px; border: 2px dashed var(--line); }
  .room span { position: absolute; top: 6px; inset-inline-start: 10px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .room.desk { background: var(--room-desk); left: 2%; top: 3%; width: 58%; height: 56%; }
  .room.meeting { background: var(--room-meeting); left: 62%; top: 3%; width: 36%; height: 40%; }
  .room.ceo { background: var(--room-ceo); left: 62%; top: 46%; width: 36%; height: 13%; }
  .room.kitchen { background: var(--room-kitchen); left: 2%; top: 62%; width: 40%; height: 35%; }
  .room.lounge { background: var(--room-lounge); left: 44%; top: 62%; width: 54%; height: 35%; }
  .furn { position: absolute; font-size: clamp(14px, 2vw, 24px); opacity: .55; pointer-events: none; }
  .deskbox { position: absolute; width: 11%; height: 7%; background: color-mix(in srgb, var(--ink) 8%, transparent); border-radius: 6px; }

  .agent { position: absolute; width: 0; height: 0; transition: left 1.8s ease-in-out, top 1.8s ease-in-out; z-index: 2; }
  .agent .body { position: absolute; transform: translate(-50%, -50%); width: clamp(34px, 4.2vw, 50px); height: clamp(34px, 4.2vw, 50px);
    border-radius: 50%; display: grid; place-items: center; font-size: clamp(18px, 2.4vw, 28px); background: var(--panel);
    border: 3px solid var(--c); box-shadow: 0 2px 8px rgba(0,0,0,.15); animation: bob 2.6s ease-in-out infinite; }
  .agent.walking .body { animation: walk .35s ease-in-out infinite; }
  .agent.thinking .body { box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 30%, transparent); }
  @keyframes bob { 50% { transform: translate(-50%, -56%); } }
  @keyframes walk { 0%,100% { transform: translate(-50%, -50%) rotate(-6deg); } 50% { transform: translate(-50%, -58%) rotate(6deg); } }
  .agent .label { position: absolute; transform: translate(-50%, 0); top: clamp(18px, 2.4vw, 28px); white-space: nowrap; font-size: 11px;
    font-weight: 700; background: var(--panel); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); }
  .agent .mood { position: absolute; transform: translate(10%, -150%); font-size: 14px; }
  .bubble { position: absolute; bottom: clamp(22px, 2.8vw, 32px); transform: translateX(-50%); background: var(--panel); color: var(--ink);
    border: 2px solid var(--c); border-radius: 12px; padding: 6px 10px; font-size: 12px; width: max-content; max-width: 200px;
    box-shadow: 0 4px 12px rgba(0,0,0,.12); animation: pop .25s ease-out; z-index: 3; line-height: 1.4; }
  .bubble::after { content: ""; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: var(--c); }
  .bubble.thought { border-style: dashed; color: var(--muted); font-style: italic; }
  .dots::after { content: "…"; animation: blink 1s infinite; }
  @keyframes pop { from { transform: translateX(-50%) scale(.6); opacity: 0; } }

  /* اللوحات */
  aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; }
  .staff { display: grid; gap: 6px; }
  .member { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
  .member .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; border: 2px solid var(--c); }
  .member b { font-size: 13px; }
  .member .act { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .bar i { display: block; height: 100%; background: var(--c); transition: width .6s; }
  #feed { max-height: 300px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
  #feed div { padding: 4px 6px; border-radius: 6px; animation: pop2 .3s; }
  #feed .say { background: var(--bg); }
  #feed .done { background: color-mix(in srgb, #2a9d8f 15%, transparent); }
  #feed .ceo { background: color-mix(in srgb, #e63946 12%, transparent); font-weight: 600; }
  #feed small { color: var(--muted); margin-inline-end: 4px; font-variant-numeric: tabular-nums; }
  @keyframes pop2 { from { opacity: 0; transform: translateY(-4px); } }

  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .col h3 { font-size: 11px; color: var(--muted); margin: 0 0 4px; }
  .task { font-size: 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px; margin-bottom: 4px; }
  .task .bar i { background: var(--accent); }
  form { display: flex; gap: 6px; margin-top: 8px; }
  input { flex: 1; min-width: 0; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 13px; }
  button { padding: 7px 12px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font: inherit; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🏢 مقر شركة النهرين — بث حي</h1>
  <span class="pill live">مباشر</span>
  <span class="pill" id="mode">…</span>
  <span id="clock">--:--</span>
</header>

<main>
  <section id="office">
    <div class="room desk"><span>💻 المكاتب</span></div>
    <div class="room meeting"><span>🗣️ غرفة الاجتماعات</span></div>
    <div class="room ceo"><span>👔 مكتب المدير</span></div>
    <div class="room kitchen"><span>☕ المطبخ</span></div>
    <div class="room lounge"><span>🛋️ الاستراحة</span></div>
    <div class="furn" style="left:76%;top:20%">🟫🟫🟫</div>
    <div class="furn" style="left:8%;top:72%">☕🍩</div>
    <div class="furn" style="left:30%;top:86%">🚰</div>
    <div class="furn" style="left:58%;top:84%">🛋️🪴</div>
    <div class="furn" style="left:88%;top:72%">🎮</div>
    <div class="furn" style="left:90%;top:50%">🪴</div>
  </section>

  <aside>
    <div class="card">
      <h2>👥 الموظفون</h2>
      <div class="staff" id="staff"></div>
    </div>
    <div class="card">
      <h2>📋 لوحة المهام</h2>
      <div class="board">
        <div class="col"><h3>للتنفيذ</h3><div id="todo"></div></div>
        <div class="col"><h3>قيد العمل</h3><div id="doing"></div></div>
        <div class="col"><h3>منجزة</h3><div id="done"></div></div>
      </div>
      <form id="taskForm"><input id="taskInput" placeholder="أضف مهمة للفريق…"><button>إضافة</button></form>
      <form id="annForm"><input id="annInput" placeholder="إعلان من المدير للجميع…"><button>📢</button></form>
    </div>
    <div class="card">
      <h2>📰 ماذا يحدث الآن</h2>
      <div id="feed"></div>
    </div>
  </aside>
</main>

<script>
const office = document.getElementById("office");
const agents = {};
let state = null;

// مواقع المكاتب داخل غرفة المكاتب (نسبة مئوية من المخطط)
const DESKS = [[12,18],[28,18],[44,18],[12,42],[28,42],[44,42]];
DESKS.forEach(([x, y]) => {
  const d = document.createElement("div");
  d.className = "deskbox";
  d.style.left = (x - 5.5) + "%"; d.style.top = (y + 4) + "%";
  office.appendChild(d);
});

const ROOM_BOX = { meeting: [64, 10, 96, 40], ceo: [66, 50, 96, 57], kitchen: [6, 70, 40, 94], lounge: [48, 70, 96, 94] };
const spots = {};
function spotFor(e, idx) {
  if (e.room === "desk") return DESKS[idx % DESKS.length];
  // نجلس قرب من نكلمه إن وجد
  if (e.sayTo && state) {
    const t = state.employees.find((o) => o.id === e.sayTo);
    if (t && t.room === e.room && spots[t.id]) return [spots[t.id][0] + 5, spots[t.id][1] + 3];
  }
  const key = e.id + e.room;
  if (!spots[key]) {
    const [x1, y1, x2, y2] = ROOM_BOX[e.room] || ROOM_BOX.lounge;
    spots[key] = [x1 + Math.random() * (x2 - x1), y1 + Math.random() * (y2 - y1)];
  }
  return spots[key];
}

function render() {
  if (!state) return;
  document.getElementById("clock").textContent = "🕘 " + state.clock;
  document.getElementById("mode").textContent = state.mode === "claude" ? "🧠 عقول Claude حقيقية" : "🎭 وضع المحاكاة";

  state.employees.forEach((e, i) => {
    let a = agents[e.id];
    if (!a) {
      a = document.createElement("div");
      a.className = "agent";
      a.style.setProperty("--c", e.color);
      a.innerHTML = `<div class="body">${e.emoji}</div><div class="mood"></div><div class="label">${e.name}</div>`;
      office.appendChild(a);
      agents[e.id] = a;
    }
    const [x, y] = spotFor(e, i);
    spots[e.id] = [x, y];
    const moved = a.style.left !== x + "%" || a.style.top !== y + "%";
    if (moved && a.style.left) { a.classList.add("walking"); clearTimeout(a._w); a._w = setTimeout(() => a.classList.remove("walking"), 1800); }
    a.style.left = x + "%"; a.style.top = y + "%";
    a.querySelector(".mood").textContent = e.mood;

    a.querySelector(".bubble")?.remove();
    if (e.say || e.thought) {
      const b = document.createElement("div");
      b.className = "bubble" + (e.say ? "" : " thought");
      b.textContent = e.say || "💭 " + e.thought;
      if (x < 16) b.style.transform = "translateX(-15%)";
      else if (x > 84) b.style.transform = "translateX(-85%)";
      a.appendChild(b);
    }
  });

  document.getElementById("staff").innerHTML = state.employees.map((e) => `
    <div class="member" style="--c:${e.color}">
      <div class="av">${e.emoji}</div>
      <div style="min-width:0"><b>${e.name}</b> <span style="color:var(--muted)">· ${e.role}</span>
        <div class="act">${state.rooms[e.room]} — ${esc(e.activity)}</div>
        <div class="bar" title="الطاقة"><i style="width:${e.energy}%"></i></div></div>
      <div style="font-size:20px">${e.mood}</div>
    </div>`).join("");

  for (const s of ["todo", "doing", "done"]) {
    document.getElementById(s).innerHTML = state.tasks.filter((t) => t.status === s).map((t) => `
      <div class="task">#${t.id} ${esc(t.title)}${t.owner ? `<br><small>👤 ${esc(t.owner)}</small>` : ""}
        ${s === "doing" ? `<div class="bar"><i style="width:${t.progress}%"></i></div>` : ""}</div>`).join("");
  }
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

const es = new EventSource("/events");
es.addEventListener("state", (ev) => { state = JSON.parse(ev.data); Object.values(agents).forEach((a) => a.classList.remove("thinking")); render(); });
es.addEventListener("thinking", (ev) => {
  const { id } = JSON.parse(ev.data);
  const a = agents[id]; if (!a) return;
  a.classList.add("thinking");
  if (!a.querySelector(".bubble")) {
    const b = document.createElement("div"); b.className = "bubble thought dots"; b.textContent = "💭 يفكر"; a.appendChild(b);
  }
});
es.addEventListener("feed", (ev) => {
  const f = JSON.parse(ev.data);
  const d = document.createElement("div");
  d.className = f.kind;
  d.innerHTML = `<small>${f.clock}</small>${esc(f.text)}`;
  const feed = document.getElementById("feed");
  feed.prepend(d);
  while (feed.children.length > 60) feed.lastChild.remove();
});

function post(url, body) { return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); }
document.getElementById("taskForm").onsubmit = (e) => { e.preventDefault(); const i = document.getElementById("taskInput"); if (i.value.trim()) post("/api/task", { title: i.value }); i.value = ""; };
document.getElementById("annForm").onsubmit = (e) => { e.preventDefault(); const i = document.getElementById("annInput"); if (i.value.trim()) post("/api/announce", { text: i.value }); i.value = ""; };
</script>
</body>
</html>
